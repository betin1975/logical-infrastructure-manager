name: lim

services:
  lim:
    build:
      context: .
      args:
        PYTHON_VERSION: "3.12"
    image: lim:local
    init: true
    restart: "no"
    environment:
      LIM_APP__ENVIRONMENT: container
    volumes:
      - ./runtime:/opt/lim/runtime
      - ./ssh:/opt/lim/ssh
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
