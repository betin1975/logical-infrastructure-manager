name: lim

services:
  lim:
    build:
      context: .
      args:
        PYTHON_VERSION: "3.12"
    image: lim:local
    init: true
    restart: "no"
    environment:
      LIM_APP__ENVIRONMENT: container
    volumes:
      - ./runtime:/opt/lim/runtime
      - type: bind
        source: ./ssh/lim_admin_ed25519
        target: /opt/lim/ssh/lim_admin_ed25519
        read_only: true
      - type: bind
        source: ./ssh/monitor_ed25519
        target: /opt/lim/ssh/monitor_ed25519
        read_only: true
      - type: bind
        source: ./ssh/monitor_ed25519.pub
        target: /opt/lim/ssh/monitor_ed25519.pub
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
